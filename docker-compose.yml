# Applaud: works with `docker compose up -d` and as a Portainer stack deployed
# from this Git repository (see docs/portainer.md). The image is built from
# this checkout; there is no registry image for the current version yet.
#
# This container listens on 0.0.0.0, so a LAN access token is required. One is
# generated on first start and printed to the container log; set
# APPLAUD_LAN_TOKEN to pin your own instead (min. 16 chars). Applaud needs
# outbound HTTPS to Plaud; it needs no inbound access from the internet.
services:
  applaud:
    build: .
    image: applaud:local
    # Built here, never pulled: without this, Portainer's "re-pull image"
    # asks Docker Hub for applaud:local and the redeploy fails.
    pull_policy: build
    container_name: applaud
    restart: unless-stopped
    ports:
      # Host port : container port. Change APPLAUD_PORT, not the right-hand side.
      - "${APPLAUD_PORT:-44471}:44471"
    environment:
      APPLAUD_NO_OPEN: "1"
      # Hostname(s) you open Applaud on, if not an IP or a .lan/.local name.
      APPLAUD_ALLOWED_HOSTS: ${APPLAUD_ALLOWED_HOSTS:-}
      # Read on first start only; afterwards change it in Settings → LAN Access.
      APPLAUD_LAN_TOKEN: ${APPLAUD_LAN_TOKEN:-}
      # Uncomment if a webhook target (e.g. n8n) is on your LAN or this host.
      # APPLAUD_WEBHOOK_ALLOW_PRIVATE: "1"
    volumes:
      - config:/data/config
      - recordings:/data/recordings

volumes:
  config:
  recordings:
